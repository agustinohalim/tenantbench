cubes:
  - name: loan
    sql_table: bird_financial.loan
    joins:
      - name: account
        sql: "{CUBE}.account_id = {account}.account_id"
        relationship: many_to_one
    dimensions:
      - name: loan_id
        sql: loan_id
        type: number
        primary_key: true
        public: true
      - name: tenant_id
        sql: tenant_id
        type: number
      - name: account_id
        sql: account_id
        type: number
      - name: amount
        sql: amount
        type: number
      - name: status
        sql: status
        type: string
    measures:
      - name: count
        type: count
      - name: total_amount
        sql: amount
        type: sum
    access_policy:
      - group: tenant
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: tenant_id
              operator: equals
              values: [ "{ securityContext.tenant }" ]
